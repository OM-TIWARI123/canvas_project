name: Deploy Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy-staging:
    runs-on: ubuntu-latest

    environment: 'staging'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Remove pre-installed Pulumi
        run: |
          rm -rf ~/.pulumi
          sudo rm -f /usr/local/bin/pulumi*

      - name: Run database migrations
        run: pnpm run db:migrate

      - name: Deploy
        run: pnpm run deploy:staging

    env:
      # Environment
      ENVIRONMENT: ${{ vars.ENVIRONMENT }}

      # AWS
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # Cloudflare
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}

      # API
      ## Node Environment
      NODE_ENV: ${{ vars.NODE_ENV }}
      ## Application
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
      ## Database
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ## BetterAuth
      BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      COOKIE_DOMAIN: ${{ vars.COOKIE_DOMAIN }}
      ## SMTP
      SMTP_NAME: ${{ vars.SMTP_NAME }}
      SMTP_MAIL: ${{ vars.SMTP_MAIL }}
      SMTP_REPLY_TO: ${{ vars.SMTP_REPLY_TO }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ## APP URL
      API_URL: ${{ vars.API_URL }}
      ADMIN_APP_URL: ${{ vars.ADMIN_APP_URL }}
      USER_APP_URL: ${{ vars.USER_APP_URL }}
      ## Shopify
      SHOPIFY_HOSTNAME: ${{ vars.SHOPIFY_HOSTNAME }}
      SHOPIFY_CLIENT_ID: ${{ vars.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      SHOPIFY_SCOPES: ${{ vars.SHOPIFY_SCOPES }}
      ## Stripe
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_BETTERAUTH_WEBHOOK_SECRET: ${{ secrets.STRIPE_BETTERAUTH_WEBHOOK_SECRET }}
      STRIPE_FREE_PRICE_ID: ${{ vars.STRIPE_FREE_PRICE_ID }}
      STRIPE_STARTER_PRICE_ID: ${{ vars.STRIPE_STARTER_PRICE_ID }}
      STRIPE_PRO_PRICE_ID: ${{ vars.STRIPE_PRO_PRICE_ID }}

      # Admin/User Apps
      ## APPS URLs
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_ADMIN_APP_URL: ${{ vars.VITE_ADMIN_APP_URL }}
      VITE_USER_APP_URL: ${{ vars.VITE_USER_APP_URL }}
      VITE_SHOPIFY_CLIENT_ID: ${{ vars.SHOPIFY_CLIENT_ID }}
      VITE_SHOPIFY_INSTALL_URL: ${{ vars.VITE_SHOPIFY_INSTALL_URL }}
